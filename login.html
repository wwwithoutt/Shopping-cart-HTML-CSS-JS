<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Mobil ekranlarda uyumlu görünüm sağlar -->
    <title>Giriş Sayfası</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
</head>
<body class="bg-light">

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <!-- Bootstrap sınıfları -->

        <div class="card shadow-sm p-4"
             style="width: 100%; max-width: 360px;">
            <!-- card = Bootstrap kart görünümü verir, shadow gölge, p-4 iç boşluk -->

            <h4 class="text-center mb-4">
                Giriş Yap
            </h4>

            <form id="girisFormu">
                <!-- Kullanıcı adı alanı -->
                <div class="mb-3">
                    <label for="kullanici_adi" class="form-label">
                        Kullanıcı Adı
                    </label>
                    <input type="text"
                           class="form-control"
                           id="kullanici_adi"
                           name="kullanici_adi"
                           placeholder="Kullanıcı adınızı girin"
                           required />
                </div>

                <!-- Şifre alanı -->
                <div class="mb-3">
                    <label for="sifre" class="form-label">
                        Şifre
                    </label>
                    <input type="password"
                           class="form-control"
                           id="sifre"
                           name="sifre"
                           placeholder="Şifrenizi girin"
                           required />
                      <span><input type="checkbox" class="password-checkbox"> Sifreyi goster</span>
                </div>

                <!-- Giriş butonu -->
                <button type="submit"
                        class="btn btn-primary w-100">
                    Giriş
                </button>
            </form>

            <!-- Mesaj alanı -->
            <div id="sonuc"
                 class="text-center mt-3">
            </div>
        </div>
    </div>

    <!-- Uygulama JS -->
    <script src="app.js" defer></script>
    <!-- defer: JavaScript'in HTML elemanları oluşturulmadan önce onları aramaya çalışmasını önlemeye yardımcı olur. -->

</body>
</html>
